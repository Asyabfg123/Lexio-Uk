<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LexiGo" />
  <meta name="theme-color" content="#0b1120" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="icon" href="icon.png" />
  <title>LexiGo</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    :root { --accent: #3b82f6; --accent-soft: #93c5fd; --accent-ink: #ffffff; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div class="brand">Lexi<span>Go</span> <small id="totalBadge"></small></div>
      <div class="top-controls">
        <button class="pill-btn" id="accentBtn" type="button">🇬🇧 UK</button>
        <button class="pill-btn" id="resetBtn" type="button">Сброс</button>
      </div>
    </div>

    <div class="levels" id="levelsBar" style="grid-template-columns: repeat(5, 1fr)"></div>

    <div class="block-bar">
      <button class="pill-btn arrow" id="prevBlock" type="button" aria-label="Предыдущий блок">‹</button>
      <select id="blockSelect" class="block-select" aria-label="Блок слов"></select>
      <button class="pill-btn arrow" id="nextBlock" type="button" aria-label="Следующий блок">›</button>
    </div>

    <div class="modes" id="modesBar">
      <button class="mode-btn" data-mode="cards" type="button">1. Карточки</button>
      <button class="mode-btn" data-mode="ru2en" type="button">2. Рус → Англ</button>
      <button class="mode-btn" data-mode="en2ru" type="button">3. Англ → Рус</button>
    </div>

    <div class="progress-wrap">
      <span id="progressText"></span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div id="stage"></div>
    <div class="footer-note">Внутри уровня слова идут от частых к редким · заглавными буквами выделен ударный слог</div>
  </div>

  <script src="words-01.js"></script>
  <script src="words-02.js"></script>
  <script src="words-03.js"></script>
  <script src="words-04.js"></script>
  <script src="words-05.js"></script>
  <script src="words-06.js"></script>
  <script src="words-07.js"></script>
  <script src="words-08.js"></script>
  <script src="levels.js"></script>
  <script src="app.js"></script>
</body>
</html>
